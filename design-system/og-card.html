<!doctype html>
<!--
  Source for assets/og-image.jpg, the 1200×630 link preview card.
  Re-render after swapping the hero poster (see README → Link preview).
-->
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>OG card</title>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,100..900&family=JetBrains+Mono:wght@400;500&display=block">
  <style>
    :root {
      --bg: #0B0A09;
      --fg: #F1EBE1;
      --fg-2: #B5ADA1;
      --fg-3: #857E74;
      --line-strong: rgba(241, 235, 225, .38);
      --accent: #FF4B1F;
      --font-display: "Archivo", system-ui, sans-serif;
      --font-mono: "JetBrains Mono", ui-monospace, monospace;
    }
    * { box-sizing: border-box; margin: 0; }
    html, body { width: 1200px; height: 630px; overflow: hidden; background: var(--bg); color: var(--fg); }

    .card {
      position: relative;
      width: 1200px;
      height: 630px;
      padding: 0 64px 58px;
      display: flex;
      flex-direction: column;
      justify-content: flex-end;
      background: var(--bg) url("../assets/video/hero-poster.webp") center 40% / cover no-repeat;
      isolation: isolate;
    }
    .shade {
      position: absolute;
      inset: 0;
      z-index: -1;
      background:
        linear-gradient(180deg, rgba(11, 10, 9, .72) 0%, rgba(11, 10, 9, .08) 30%, rgba(11, 10, 9, .3) 52%, rgba(11, 10, 9, .9) 80%, var(--bg) 100%),
        radial-gradient(120% 80% at 0% 100%, rgba(11, 10, 9, .6), transparent 60%);
    }

    .vf { position: absolute; inset: 28px; pointer-events: none; }
    .vf i { position: absolute; width: 34px; height: 34px; border: 0 solid rgba(241, 235, 225, .75); }
    .vf i:nth-child(1) { top: 0; left: 0; border-top-width: 2px; border-left-width: 2px; }
    .vf i:nth-child(2) { top: 0; right: 0; border-top-width: 2px; border-right-width: 2px; }
    .vf i:nth-child(3) { bottom: 0; left: 0; border-bottom-width: 2px; border-left-width: 2px; }
    .vf i:nth-child(4) { bottom: 0; right: 0; border-bottom-width: 2px; border-right-width: 2px; }

    .hud {
      position: absolute;
      top: 54px;
      left: 64px;
      right: 64px;
      display: flex;
      justify-content: space-between;
      font-family: var(--font-mono);
      font-size: 17px;
      letter-spacing: .08em;
      text-transform: uppercase;
      text-shadow: 0 1px 8px rgba(0, 0, 0, .5);
    }
    .hud__left { display: grid; gap: 6px; }
    .hud__rec { display: inline-flex; align-items: center; gap: 10px; font-weight: 500; }
    .hud__rec b { width: 12px; height: 12px; border-radius: 50%; background: var(--accent); }
    .hud__tc { font-size: 22px; font-variant-numeric: tabular-nums; }
    .hud__right { color: var(--fg-2); }

    .kicker {
      display: inline-flex;
      align-items: center;
      gap: 14px;
      font-family: var(--font-mono);
      font-size: 20px;
      letter-spacing: .14em;
      text-transform: uppercase;
    }
    .kicker::before { content: ""; width: 12px; height: 12px; background: var(--accent); }
    .kicker span { color: var(--fg-3); }

    .title {
      font-family: var(--font-display);
      font-stretch: 125%;
      font-weight: 900;
      font-size: 212px;
      line-height: .78;
      letter-spacing: -.04em;
      text-transform: uppercase;
      margin: 22px 0 0 -.05em;
      white-space: nowrap;
    }

    .row {
      display: flex;
      justify-content: space-between;
      align-items: baseline;
      gap: 32px;
      margin-top: 30px;
      padding-top: 22px;
      border-top: 1px solid var(--line-strong);
      font-family: var(--font-display);
      font-size: 26px;
      line-height: 1.3;
    }
    .row__haus {
      font-family: var(--font-mono);
      font-size: 17px;
      letter-spacing: .1em;
      text-transform: uppercase;
      color: var(--fg-2);
      white-space: nowrap;
    }
  </style>
</head>
<body>
  <div class="card">
    <div class="shade"></div>
    <div class="vf"><i></i><i></i><i></i><i></i></div>

    <div class="hud">
      <div class="hud__left">
        <span class="hud__rec"><b></b>REC</span>
        <span class="hud__tc">17:00:00:00</span>
      </div>
      <span class="hud__right">4K · 24P · ISO 800</span>
    </div>

    <p class="kicker">Photographer <span>/</span> Filmmaker <span>/</span> Rider</p>
    <h1 class="title">Jensen</h1>
    <div class="row">
      <p>Stills and motion from the hours after five.</p>
      <p class="row__haus">Founder, After Work Haus</p>
    </div>
  </div>
</body>
</html>
